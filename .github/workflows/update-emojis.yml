name: Update Unicode Emojis

on:
  schedule:
    # Run on the 1st of each month at midnight UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:
    # Allow manual triggering

jobs:
  update-emojis:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run update script
        id: update
        run: node scripts/update-emojis.js

      - name: Check for changes
        id: changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Get version info
        if: steps.changes.outputs.changed == 'true'
        id: version
        run: |
          VERSION=$(grep -oP 'Unicode-\K[\d.]+' README.md | head -1)
          OLD_COUNT=$(git show HEAD:src/random-unicode-emoji.js | grep -o '"[^"]*"' | wc -l)
          NEW_COUNT=$(grep -o '"[^"]*"' src/random-unicode-emoji.js | wc -l)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "old_count=$OLD_COUNT" >> $GITHUB_OUTPUT
          echo "new_count=$NEW_COUNT" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: update to Unicode Emoji ${{ steps.version.outputs.version }}"
          title: "Update to Unicode Emoji ${{ steps.version.outputs.version }}"
          body: |
            This PR updates the emoji list to Unicode Emoji ${{ steps.version.outputs.version }}.

            ## Changes
            - Emoji count: ${{ steps.version.outputs.old_count }} → ${{ steps.version.outputs.new_count }}

            ## Links
            - [Unicode Emoji Charts](https://unicode.org/emoji/charts/emoji-list.html)
            - [What's New in Unicode](https://www.unicode.org/versions/latest/)

            ---
            *This PR was automatically generated by the Update Unicode Emojis workflow.*
          branch: update-emojis-${{ steps.version.outputs.version }}
          delete-branch: true
          labels: |
            dependencies
            automated
